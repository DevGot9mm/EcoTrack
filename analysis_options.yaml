# EcoTrack analysis options.
#
# Keep analyzer configuration focused on checks used by this project.
analyzer:
  exclude:
    - build/**
    - prototype/**
    - web/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    unused_local_variable: warning
    dead_code: warning

linter:
  rules:
    - avoid_print
    - prefer_single_quotes
    - unnecessary_this
