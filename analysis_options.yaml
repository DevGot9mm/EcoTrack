# EcoTrack analysis options.
#
# Starts from the official Flutter lint set, then adds a few project rules.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - docs/**
    - web/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    unused_local_variable: warning
    dead_code: warning

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: true
    unnecessary_this: true
